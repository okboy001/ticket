<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>領取門票 - 2026 柏友才藝表演Show</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { 
      background-color: #1a0505; 
      background-image: radial-gradient(circle at 50% 0%, #4a0e0e 0%, #1a0505 80%); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px; 
    }
    
    .card-wrapper { width: 100%; max-width: 360px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); overflow: hidden; }
    .card-header { background: linear-gradient(180deg, #8b0000 0%, #5c0000 100%); color: #ffffff; padding: 20px 16px; text-align: center; }
    .fund-badge { display: inline-block; background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%); color: #3a0000; font-size: 13px; font-weight: 900; padding: 4px 14px; border-radius: 50px; margin-bottom: 8px; }
    .event-title { font-size: 22px; font-weight: 900; margin: 0; color: #ffffff; line-height: 1.25; }
    
    .card-body { padding: 24px 20px; background: #ffffff; text-align: center; }
    .search-title { color: #0f172a; font-size: 20px; font-weight: 900; margin: 0 0 10px 0; }
    .search-desc { color: #64748b; font-size: 14px; margin: 0 0 20px 0; font-weight: 600; line-height: 1.4; }
    
    .input-field { width: 100%; padding: 16px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 20px; text-align: center; outline: none; margin-bottom: 20px; letter-spacing: 2px; font-weight: bold; background: #f8fafc; }
    .input-field:focus { border-color: #8b0000; background: #ffffff; }
    
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%); color: #3a0000; font-size: 18px; font-weight: 900; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .submit-btn:disabled { opacity: 0.7; }
  </style>
</head>
<body>

  <div class="card-wrapper">
    <div class="card-header">
      <div class="fund-badge">黃俊健紀念基金</div>
      <h1 class="event-title">2026 柏友才藝表演Show</h1>
    </div>
    
    <div class="card-body">
      <h2 class="search-title">🎟️ 領取電子門票</h2>
      <p class="search-desc">請輸入您登記的電話號碼，系統將自動為您核對並生成專屬門票。</p>
      
      <input type="tel" id="searchPhone" class="input-field" placeholder="例如：98765432">
      <button class="submit-btn" onclick="searchTicket()" id="searchBtn">尋找我的門票</button>
    </div>
  </div>

  <script>
    function searchTicket() {
      // 讀取輸入值，並即時清除所有空格
      const rawInput = document.getElementById('searchPhone').value;
      const phoneInput = rawInput.replace(/\s+/g, "");
      
      if (!phoneInput) { alert('請輸入電話號碼！'); return; }

      const btn = document.getElementById('searchBtn');
      btn.innerText = "⏳ 正在尋找門票...";
      btn.disabled = true;

      // 你的專屬 Apps Script Web App URL
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzNioOdDgd0zstYRjfk_taf5Ep_2dTqQXkit0upw1VkJDTW08nU9DTA9lOV34qwnx_h/exec'; 

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({ phone: phoneInput })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          btn.innerText = "✅ 成功！正在載入門票...";
          
          // 將搵到嘅資料砌成 URL 參數
          const params = new URLSearchParams();
          params.append('name', data.name);
          params.append('seat', data.seat);
          params.append('floor', data.floor);
          
          // 自動跳轉去 index.html 顯示靚飛
          window.location.href = 'index.html?' + params.toString();
          
        } else if (data.status === 'not_found') {
          alert("⚠️ " + data.message);
          resetBtn();
        } else {
          alert('系統錯誤，請稍後再試。');
          resetBtn();
        }
      })
      .catch(err => {
        alert('網絡連線不穩定，請重試。');
        resetBtn();
      });

      function resetBtn() {
        btn.innerText = "尋找我的門票";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
