<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>2026 柏友才藝表演Show - 觀賞門票</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; padding: 0; }
      body {
        background-color: #1a0505;
        background-image: radial-gradient(circle at 50% 0%, #4a0e0e 0%, #1a0505 80%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "微軟正黑體", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 6px 12px;
      }
      .ticket-wrapper { width: 100%; max-width: 360px; position: relative; }
      .ticket { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); overflow: hidden; position: relative; }
      .ticket-header { background: linear-gradient(180deg, #8b0000 0%, #5c0000 100%); color: #ffffff; padding: 12px 12px 10px; text-align: center; position: relative; z-index: 2; }
      .fund-badge { display: inline-block; background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%); color: #3a0000; font-size: 12px; font-weight: 900; padding: 2px 12px; border-radius: 50px; margin-bottom: 4px; }
      .event-title { font-size: 20px; font-weight: 900; margin: 0 0 2px 0; color: #ffffff; line-height: 1.25; }
      .ticket-subtitle { font-size: 13px; color: #f3e5ab; font-weight: 800; letter-spacing: 2px; margin: 0; }
      .ticket-body { padding: 12px 14px 12px; background: #ffffff; position: relative; z-index: 1; margin-top: -2px; }
      .ticket-body::before, .ticket-body::after { content: ""; position: absolute; top: -10px; width: 20px; height: 20px; background-color: #1a0505; border-radius: 50%; z-index: 5; }
      .ticket-body::before { left: -10px; }
      .ticket-body::after { right: -10px; }
      .dashed-line { border-top: 2px dashed #cbd5e1; position: absolute; top: 0; left: 16px; right: 16px; }
      .info-group { text-align: center; margin-bottom: 8px; }
      .info-label { font-size: 13px; color: #64748b; margin-bottom: 1px; font-weight: 800; }
      .info-value { font-size: 30px; color: #0f172a; font-weight: 900; line-height: 1.1; }
      .seat-block { background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%); border: 2px solid #fde047; border-radius: 12px; padding: 6px 10px; text-align: center; margin-bottom: 8px; }
      .seat-label { color: #854d0e; font-size: 14px; font-weight: 900; }
      .seat-number { font-size: 36px; color: #a16207; font-weight: 900; letter-spacing: 1px; line-height: 1.1; }
      .details-box { background: #f8fafc; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; border: 1px solid #cbd5e1; }
      .detail-row { display: flex; margin-bottom: 4px; line-height: 1.3; }
      .detail-row:last-child { margin-bottom: 0; }
      .detail-title { width: 45px; color: #475569; font-size: 14px; font-weight: 900; flex-shrink: 0; }
      .detail-content { color: #0f172a; font-size: 14px; font-weight: 800; }
      .sub-text { font-size: 12px; color: #64748b; display: block; font-weight: 600; margin-top: 1px; }
      .reminder { font-size: 13px; color: #991b1b; background: #fef2f2; padding: 8px 10px; border-radius: 8px; line-height: 1.35; border-left: 4px solid #ef4444; font-weight: 800; }
    </style>
  </head>
  <body>

    <div class="ticket-wrapper">
      <div class="ticket">
        <div class="ticket-header">
          <div class="fund-badge">黃俊健紀念基金</div>
          <h1 class="event-title">2026 柏友才藝表演Show</h1>
          <div class="ticket-subtitle">觀賞門票</div>
        </div>
        
        <div class="ticket-body">
          <div class="dashed-line"></div>
          
          <div class="info-group">
            <div class="info-label">登記者姓名</div>
            <div class="info-value" id="tName">載入中...</div>
          </div>
          
          <div class="seat-block">
            <div class="seat-label">您的專屬座位 (<span id="tFloor">一樓</span>)</div>
            <div class="seat-number" id="tSeat">--</div>
          </div>
          
          <div class="details-box">
            <div class="detail-row">
              <div class="detail-title">日期</div>
              <div class="detail-content">2026年10月8日 (四)</div>
            </div>
            <div class="detail-row">
              <div class="detail-title">時間</div>
              <div class="detail-content">下午 2:00 至 5:00</div>
            </div>
            <div class="detail-row">
              <div class="detail-title">地點</div>
              <div class="detail-content">
                觀塘翠屏道3號<br>基督教家庭服務中心 一樓禮堂
                <span class="sub-text">(港鐵觀塘站 D1 出口，步行約3分鐘)</span>
              </div>
            </div>
          </div>
          
          <div class="reminder">
            ⚠️ <b>溫馨提示：</b><br>請提早 15 分鐘到達。<b>請直接使用手機截圖保存此門票</b>，以供入場核對。
          </div>
        </div>
      </div>
    </div>

    <script>
      // 自動從網址參數讀取資料
      const params = new URLSearchParams(window.location.search);
      document.getElementById('tName').innerText = params.get('name') || '參加者';
      document.getElementById('tSeat').innerText = params.get('seat') || '未分配';
      document.getElementById('tFloor').innerText = params.get('floor') || '一樓';
    </script>
  </body>
</html>
